<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta
      name="description"
      content="Let's Gist - the social network for Ghanaian SHS students. Find your school community and join the conversation."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Let's Gist - Ghana SHS Community</title>
    <script>
      try {
        const mode = localStorage.getItem("lets-gist-theme") || "system";
        const dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark ? "#121215" : "#F4F4F5";
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
