<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta
      name="description"
      content="Gist me is the social network for Ghanaian SHS students. Find your school community and join the conversation."
    />
    <meta property="og:site_name" content="Gist me" />
    <meta property="og:title" content="Gist me - Ghana SHS Community" />
    <meta
      property="og:description"
      content="Find your school community and join the conversation on Gist me, the social network for Ghanaian SHS students."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:image:alt" content="Gist me Logo" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Gist me - Ghana SHS Community" />
    <meta
      name="twitter:description"
      content="Find your school community and join the conversation on Gist me."
    />
    <meta name="twitter:image" content="/logo.png" />
    <meta name="twitter:image:alt" content="Gist me Logo" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>Gist me - Ghana SHS Community</title>
    <script>
      try {
        const mode = localStorage.getItem("lets-gist-theme") || "system";
        const dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark ? "#121215" : "#F4F4F5";
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
